http:
  method: POST
  url: http://localhost:3000/characters
  body:
    type: json
    data: |
      {
            "name": "Lu Kankys",
            "role": "student",
            "house": "Gryffindor",
            "school": "Hogwarts School of Witchcraft and Wizardry",
            "dumbledoresArmy": true,
            "bloodStatus": "half-blood",
            "species": "human"
          }
  auth:
    type: basic
    username: admin
    password: supersecret

settings:
  encodeUrl: true
  timeout: 0
