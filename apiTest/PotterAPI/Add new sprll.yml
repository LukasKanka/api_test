info:
  name: Add new sprll
  type: http
  seq: 5

http:
  method: POST
  url: http://localhost:3000/spells
  body:
    type: json
    data: |-
      {
        "spell":"Fire speed",
        "effect":"fire speed forever",
        "type":"Curse",
        "isUnforgivable":"false"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
