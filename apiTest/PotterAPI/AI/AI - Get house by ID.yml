info:
  name: AI - Get spells list
  type: http
  seq: 3

http:
  method: GET
  url: http://localhost:3000/spells
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        const status = res.getStatus()
        const body = res.getBody()

        test("Status code is 200", function() {
          expect(status).to.equal(200);
        });

        test("Response should be an array", function(){
          expect(body).to.be.an('array')
        })

        test("Array should not be empty", function(){
          expect(body).to.not.be.empty
        })

        test("Array should have at least 10 spells", function(){
          expect(body.length).to.be.at.least(10)
        })

        test("First item should have spell key", function(){
          expect(body[0]).to.contain.key("spell")
        })

        test("First item should have type key", function(){
          expect(body[0]).to.contain.key("type")
        })

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
