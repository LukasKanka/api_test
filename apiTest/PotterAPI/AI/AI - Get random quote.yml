info:
  name: AI - Get random quote
  type: http
  seq: 1

http:
  method: GET
  url: http://localhost:3000/quote
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        const status = res.getStatus()
        const body = res.getBody()

        test("Status code is 200", function() {
          expect(status).to.equal(200);
        });

        test("Response should contain author key", function(){
          expect(body).to.contain.key("author")
        })

        test("Response should contain quote key", function(){
          expect(body).to.contain.key("quote")
        })

        test("Author should not be empty", function(){
          expect(body.author).not.to.be.empty
        })

        test("Quote should not be empty", function(){
          expect(body.quote).not.to.be.empty
        })

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
