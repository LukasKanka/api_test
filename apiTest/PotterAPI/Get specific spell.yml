info:
  name: Get specific spell
  type: http
  seq: 3

http:
  method: GET
  url: http://localhost:3000/spells/5b74ed6d3228320021ab622f
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        const expectedSpell={
            "id": "5b74ed6d3228320021ab622f",
            "spell": "Alohomora",
            "type": "Charm",
            "effect": "opens locked objects",
            "isUnforgivable": false
        }

        test("It should return the correct spell", function(){
            expect(res.getBody()).to.deep.equal(expectedSpell)
        })

        //deep porovná vše 1:1

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
