name: Run Bruno API Tests

# Pipeline se spustí při každém pushnutí nebo Pull Requestu do hlavní větvě
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # 1. Krok: Stáhne kód z repozitáře do runneru
      - name: Checkout repository code
        uses: actions/checkout@v4

      # 2. Krok: Připraví prostředí Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3. Krok: Spuštění backendu
      - name: Create .env, Install dependencies and start Backend
        run: |
          cd web/backend
          echo "PORT=3000" > .env
          npm install
          node app.js > server.log 2>&1 &

      # 4. Krok: Vyčkání na server pomocí obyčejné smyčky s curl
      - name: Wait for Backend server to be ready
        run: |
          echo "Čekám na naběhnutí serveru..."
          until curl -s http://127.0.0.1:3000 > /dev/null; do
            sleep 1
          done
          echo "Server běží a odpovídá!"

      # 5. Krok: Spustí Bruno testy
      - name: Run Bruno API Tests
        run: |
          cd apiTest/PotterAPI
          npx @usebruno/cli run -r
